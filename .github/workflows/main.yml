name: Android APK (engine only)

# Builds the Android app from StillM8/RedAlert2-Engine.
# No Red Alert 2 game files are included in the APK.
# The user must import compatible game files into the app.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or SHA to build (main = release branch, beta = newer Ares work)
        required: true
        type: string
        default: main

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.10"

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the web engine
        working-directory: redalert2
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Use v4: v3 attempts to install the obsolete Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify Android SDK setup
        run: |
          set -euo pipefail
          echo "Android SDK: ${ANDROID_HOME:-not set}"
          echo "sdkmanager location:"
          command -v sdkmanager
          echo "Installed SDK packages:"
          sdkmanager --list_installed

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Stage the web engine into the Android app
        run: |
          set -euo pipefail

          rm -rf android/app/src/main/assets/WebDist
          mkdir -p android/app/src/main/assets

          cp -R redalert2/dist android/app/src/main/assets/WebDist

          rm -rf android/app/src/main/assets/GameRes
          mkdir -p android/app/src/main/assets/GameRes

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        run: |
          set -euo pipefail

          mkdir -p out

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            out/open-rts-engine-debug.apk

          echo "APK details:"
          ls -lh out/open-rts-engine-debug.apk

          echo "APK SHA-256:"
          sha256sum out/open-rts-engine-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/open-rts-engine-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Also publish the APK as a prerelease asset for direct downloading.
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-build-${{ github.run_number }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            out/open-rts-engine-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title "Android build $GITHUB_RUN_NUMBER" \
            --notes "Engine-only Android APK. No Red Alert 2 game files are included. Import compatible game files in the app."
