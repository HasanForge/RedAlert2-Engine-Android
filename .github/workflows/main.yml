name: Windows 7 SP1 x86 Compatibility Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 32-bit Windows 7 executable
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      RUST_TARGET: i686-win7-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Set up nightly Rust and source code
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Display build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          rustc --version
          cargo --version
          rustup component list --installed

      - name: Install frontend dependencies
        working-directory: redalert2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun install --frozen-lockfile

      - name: Build frontend
        working-directory: redalert2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun run build

      - name: Build Windows 7 x86 application
        working-directory: redalert2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = "i686-win7-windows-msvc"

          # This target has no prebuilt Rust standard library.
          # Build the standard library from the Rust source component.
          bun run tauri:build -- --target $target --no-bundle -Z build-std=std,panic_unwind

      - name: Collect executable and runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseDir = "redalert2/src-tauri/target/i686-win7-windows-msvc/release"

          if (!(Test-Path $releaseDir)) {
            throw "Release directory not found: $releaseDir"
          }

          $outDir = "out"
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $exes = Get-ChildItem $releaseDir -Filter "*.exe" -File

          if (!$exes) {
            throw "No executable was produced in $releaseDir"
          }

          Copy-Item "$releaseDir/*" $outDir -Recurse -Force

          Write-Host "Executables produced:"
          Get-ChildItem $outDir -Filter "*.exe" -File |
            Select-Object Name, Length

          Write-Host "All collected files:"
          Get-ChildItem $outDir -Recurse -File |
            Select-Object FullName, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedAlert2-Windows7-SP1-x86
          path: out/
          if-no-files-found: error
          retention-days: 14
