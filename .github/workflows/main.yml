name: Windows 7 SP1 x86 Compatibility Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 32-bit Windows 7 executable
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      RUST_TARGET: i686-win7-windows-msvc
      CARGO_UNSTABLE_BUILD_STD: "std,panic_unwind"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Display toolchain information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustc --version
          cargo --version
          rustc --print target-list | Select-String "i686-win7"

      - name: Install frontend dependencies
        working-directory: redalert2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun install --frozen-lockfile

      - name: Build frontend
        working-directory: redalert2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun run build

      - name: Build Windows 7 x86 application
        working-directory: redalert2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          bun run tauri:build -- --target i686-win7-windows-msvc --no-bundle

      - name: Collect build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseDir = "redalert2/src-tauri/target/i686-win7-windows-msvc/release"

          if (!(Test-Path $releaseDir)) {
            throw "Release directory not found: $releaseDir"
          }

          $outDir = "out"
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $exes = Get-ChildItem $releaseDir -Filter "*.exe" -File

          if (!$exes) {
            throw "No executable was produced in $releaseDir"
          }

          Copy-Item "$releaseDir/*" $outDir -Recurse -Force

          Write-Host "Executables:"
          Get-ChildItem $outDir -Filter "*.exe" -File |
            Select-Object Name, Length

          Write-Host "Collected files:"
          Get-ChildItem $outDir -Recurse -File |
            Select-Object FullName, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedAlert2-Windows7-SP1-x86
          path: out/
          if-no-files-found: error
          retention-days: 14
