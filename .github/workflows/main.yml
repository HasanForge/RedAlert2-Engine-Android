name: Android APK (engine only)

# Builds the Android app from StillM8/RedAlert2-Engine without the Windows,
# macOS and Linux jobs. No game files are included in the APK: import your own
# in the app. Steps mirror the repo's own .github/workflows/release.yml
# (android job), but build the debug variant, which Gradle signs automatically.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or SHA to build (main = release branch, beta = newer Ares work)
        required: true
        type: string
        default: main

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.10"

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the web engine
        working-directory: redalert2
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK. Do not use
      # android-actions/setup-android@v3: its default package list asks for the
      # legacy "tools" package, which fails with "Failed to find package 'tools'".
      - name: Install Android SDK components
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Stage the web engine into the Android app (no game files)
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/WebDist
          mkdir -p android/app/src/main/assets
          cp -R redalert2/dist android/app/src/main/assets/WebDist
          rm -rf android/app/src/main/assets/GameRes
          mkdir -p android/app/src/main/assets/GameRes

      # Debug builds get the application id io.stillm8.rtsengine.debug, but the
      # launcher aliases keep the class names io.stillm8.rtsengine.LauncherRA2
      # and LauncherYR. IconSwitchActivity builds those names from the
      # application id, so on a debug build it asks for components that do not
      # exist and the app dies a couple of seconds after the splash screen.
      # Use the real class names instead.
      - name: Fix launcher alias class names for the debug build
        run: |
          set -euo pipefail
          FILE=android/app/src/main/java/io/stillm8/rtsengine/IconSwitchActivity.kt
          sed -i 's/"\$packageName\.Launcher/"io.stillm8.rtsengine.Launcher/g' "$FILE"
          grep -n 'Launcher' "$FILE"
          grep -q '"io.stillm8.rtsengine.LauncherRA2"' "$FILE"
          grep -q '"io.stillm8.rtsengine.LauncherYR"' "$FILE"

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/open-rts-engine-debug.apk
          ls -l out
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # A release asset downloads as a plain .apk in the phone browser,
      # without the zip that workflow artifacts come in.
      - name: Publish as a prerelease (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-build-${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/open-rts-engine-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title "Android build $GITHUB_RUN_NUMBER" \
            --notes "Engine only. No game files are included. Import your own files in the app."
